min_version = "2026.10.17"

[tools]
rust = "latest"
"cabal" = "latest"
"ghcup" = "latest"
"mise-ghcup:ghc" = "latest"
"mise-ghcup:hls" = "latest"

[settings]
experimental = true

[plugins]
"vfox-backend:mise-ghcup" = "packslip:wasp-lang/mise-ghcup#3.0.0"
"vfox-backend:mise-cabal" = "packslip:wasp-lang/mise-cabal#2.0.0"

[tasks.run]
description = "run the project"
run = "cargo run"

[tasks.check]
description = "run lints with clippy"
run = "cargo clippy"

[tasks.build]
description = "build with cargo"
run = "cargo build"

[tasks.test]
depends = ["build"]
description = "run tests with the custom Haskell test runner"
run = "./test.hs ./test"

